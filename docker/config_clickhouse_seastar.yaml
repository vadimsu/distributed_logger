version: "1.0"

services:
  
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    volumes: [./listen_seastar.xml:/etc/clickhouse-server/config.d/listen.xml,
      ./users.xml:/etc/clickhouse-server/users.d/default-user.xml]
    networks:
      app_net:
        ipv4_address: 172.20.0.3
    ports:
      - "8123:8123"
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 2s
      timeout: 2s
      retries: 20

  server:
    build:
      context: ..
      dockerfile: /home/vsuraev/distributed_logger/docker/server_seastar.Dockerfile
    depends_on:
      clickhouse:
        condition: service_healthy
    ports:
      - "7777:7777"
    networks:
      app_net:
        ipv4_address: 172.20.0.4
    cap_add:
      - SYS_NICE          # Required for mbind and SCHED_FIFO
    security_opt:
      - seccomp:unconfined # Often needed to allow NUMA-related syscalls
    # Restrict resources to match Seastar's sharding
    cpus: 4
    mem_limit: 32g
    privileged: true
    healthcheck:
      test: ["CMD-SHELL", "pgrep -x seastar_server > /dev/null"]
      interval: 10s
      timeout: 10s
      start_period: 1h
      retries: 999

  client:
    build:
      context: ..
      dockerfile: /home/vsuraev/distributed_logger/docker/client.Dockerfile
    depends_on:
      server:
        condition: service_healthy
    networks:
      app_net:
        ipv4_address: 172.20.0.5

networks:
  app_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
