version: "1.0"

services:
  
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    volumes: [./listen_seastar.xml:/etc/clickhouse-server/config.d/listen.xml,
      ./users.xml:/etc/clickhouse-server/users.d/default-user.xml]
      #    networks:
      #      app_net:
      #        ipv4_address: 172.20.0.3
    network_mode: "host"
    environment:
      - CLICKHOUSE_SKIP_USER_SETUP=1
    cpuset: "0-1"
    healthcheck:
      test: ["CMD", "clickhouse-client", "-u", "default", "--password", "default", "--query", "SELECT 1"]
      interval: 2s
      timeout: 2s
      retries: 20

  server:
    build:
      context: ..
      dockerfile: ./docker/server_seastar.hostnet.Dockerfile
    depends_on:
      clickhouse:
        condition: service_healthy
    network_mode: "host"
    pid: "host"
    ipc: "host"
    cap_add:
      - SYS_NICE          # Required for mbind and SCHED_FIFO
    security_opt:
      - apparmor:unconfined
      - seccomp:unconfined # Often needed to allow NUMA-related syscalls
    # Restrict resources to match Seastar's sharding.
    # `cpus: 16` alone is only a CFS bandwidth quota - it lets the 16 reactor
    # shards float across ALL host cores and can be CFS-throttled mid-burst.
    # `cpuset` pins them to real, exclusive cores so --thread-affinity actually
    # helps instead of fighting the scheduler. Adjust the range below to match
    # cores actually available/isolated on your host (must not overlap with
    # cores given to other containers, e.g. clickhouse).
    #    cpuset: "4-5"
      #cpus: 16
      #    mem_limit: 16g
    privileged: true
    ulimits:
      rtprio: 99     # Gives container permission to use Real-Time scheduling
      memlock: -1
    cpu_shares: 4096
    healthcheck:
      test: ["CMD-SHELL", "pgrep -x seastar_server > /dev/null"]
      interval: 10s
      timeout: 10s
      start_period: 1h
      retries: 999

  client:
    build:
      context: ..
      dockerfile: ./docker/client.hostnet.Dockerfile
    depends_on:
      server:
        condition: service_healthy
    cpuset: "6-21"
    network_mode: "host"
